<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!--
      Manifes aplikasi web. Terletak DI LUAR penanda SEO supaya salinan per
      rute oleh scripts/prerender.mjs tetap memuatnya apa adanya.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Blok di antara penanda SEO:MULAI dan SEO:SELESAI diganti per rute oleh
      scripts/prerender.mjs setelah vite build. Jangan hapus penandanya: tanpa
      penanda, keenam rute kembali berbagi satu judul dan satu deskripsi.
      Nilai di bawah adalah isi rute beranda, dipakai saat dev server.
    -->
    <!-- SEO:MULAI -->
    <title>Jelajah 3D — Atlas Anatomi Tubuh Manusia Berbahasa Indonesia</title>
    <meta name="description" content="Jelajahi 2.234 bagian tubuh manusia dalam model 3D interaktif berbahasa Indonesia: 15 sistem organ, pencarian dua bahasa, dan tampilan terpisah per lapisan." />
    <link rel="canonical" href="https://jrh-atlas.pages.dev/" />
    <meta property="og:title" content="Jelajah 3D — Atlas Anatomi Tubuh Manusia Berbahasa Indonesia" />
    <meta property="og:description" content="Jelajahi 2.234 bagian tubuh manusia dalam model 3D interaktif berbahasa Indonesia: 15 sistem organ, pencarian dua bahasa, dan tampilan terpisah per lapisan." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:url" content="https://jrh-atlas.pages.dev/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Jelajah 3D — Atlas Anatomi Tubuh Manusia Berbahasa Indonesia" />
    <meta name="twitter:description" content="Jelajahi 2.234 bagian tubuh manusia dalam model 3D interaktif berbahasa Indonesia: 15 sistem organ, pencarian dua bahasa, dan tampilan terpisah per lapisan." />
    <!-- SEO:SELESAI -->
    <script>
      // Set tema sebelum paint pertama: cegah kilatan putih/hitam.
      (function () {
        try {
          var mode = localStorage.getItem('jrh-atlas-tema') || 'auto';
          var palet = localStorage.getItem('jrh-atlas-palet') || 'nusantara';
          var gelap = mode === 'gelap' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          var h = document.documentElement;
          h.dataset.palet = palet;
          h.dataset.tema = gelap ? 'gelap' : 'terang';
          h.style.colorScheme = gelap ? 'dark' : 'light';
          if (gelap) h.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
