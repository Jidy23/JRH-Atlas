name: Production lazy loading checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    # Dinaikkan dari 20 ke 40 menit di Batch 7. Sejak apt dipisah dari unduhan
    # browser, percobaan terburuknya 3 x 420 detik = 21 menit, dan itu belum
    # termasuk build serta tes. Batas 20 menit akan membunuh job di tengah apt
    # justru pada hari ketika mirror bermasalah, yaitu hari ketika diagnosa
    # paling dibutuhkan.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      # Chunks are packed by organ system at build time, so the visibility-driven
      # loader can skip whole systems instead of only the one leftover chunk.
      - name: Repack anatomy chunks per organ system
        run: node scripts/repack-chunks.mjs
      - name: Verify chunk packing matches organ systems
        run: node scripts/validate-chunks.mjs
      # Setelah repack, "tampilan awal" benar-benar berarti tujuh chunk, jadi
      # anggaran biaya unduhan kunjungan pertama baru bisa ditegakkan di sini.
      # Di `Cek` langkah yang sama hanya melaporkan angka, karena manifes di
      # repo masih memakai packing lama.
      - name: Audit asset budget on repacked layout
        run: npm run audit:aset
      - run: npm run build
      # Prerender menulis HTML per route, sitemap, dan menyalin aset publik.
      # Diperiksa terhadap keluaran nyata: route yang lupa punya judul sendiri
      # sebelumnya hanya terlihat di produksi.
      - name: Verify prerendered routes and public assets
        run: |
          node --input-type=module - <<'JS'
          import {existsSync, readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('app/rute.json','utf8'));
          const gagal=[];
          for(const r of data.rute){
            const f=r.path==='/'?'dist/index.html':`dist${r.path}/index.html`;
            if(!existsSync(f)){gagal.push(`${r.path}: tidak ada ${f}`);continue;}
            const html=readFileSync(f,'utf8');
            if(!html.includes(`<link rel="canonical" href="${data.situs}${r.path}" />`))gagal.push(`${r.path}: kanonik salah`);
            if(!html.includes('application/ld+json'))gagal.push(`${r.path}: JSON-LD hilang`);
            if(!html.includes('rel="manifest"'))gagal.push(`${r.path}: manifest hilang`);
          }
          for(const a of ['dist/manifest.webmanifest','dist/robots.txt','dist/sitemap.xml'])if(!existsSync(a))gagal.push(`hilang: ${a}`);
          if(gagal.length){console.error(gagal.join('\n'));process.exit(1);}
          console.log(`✓ ${data.rute.length} rute + aset publik lengkap`);
          JS
      # Batch 7: sebelumnya satu langkah berisi `playwright install --with-deps`,
      # pola yang sama dengan Mobile #104. Di sana terbukti bahwa yang
      # menggantung bukan unduhan Chromium melainkan apt (119 MB paket sistem,
      # mirror azure.archive.ubuntu.com berhenti menjawab), dan karena keduanya
      # digabung dalam satu langkah tanpa batas waktu, tidak ada cara membedakan
      # "lambat" dari "mati". Production #107 dan #108 lolos hanya karena
      # mirror-nya sehat saat itu; workflow ini belum pernah kena.
      - name: Install Playwright package
        id: pw
        run: |
          npm install --prefix /tmp/ui-browser --no-package-lock playwright @axe-core/playwright
          # Versi dibaca dari paket yang benar-benar terpasang, bukan ditebak,
          # supaya kunci cache ikut berubah saat Playwright naik versi.
          versi=$(node -p "require('/tmp/ui-browser/node_modules/playwright/package.json').version")
          echo "versi=$versi" >> "$GITHUB_OUTPUT"
          echo "Playwright $versi terpasang."
      - name: Cache browser engines
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Hanya chromium: job ini tidak menguji WebKit atau Firefox.
          # Batch 8: `${{ runner.os }}`, bukan `${runner.os}`. Yang kedua adalah
          # sintaks shell, bukan ekspresi Actions, jadi kunci cache akan berisi
          # teks literal dan tidak pernah cocok antar-run.
          key: pw-${{ runner.os }}-chromium-${{ steps.pw.outputs.versi }}
      - name: Install system dependencies for Chromium
        run: |
          # Batch 8: pola `timeout 420 cmd | tee log` yang saya tulis di Batch 7
          # DIGANTI, karena Batch 8 membuktikan pola itu tidak membatasi apa pun
          # di Mobile #109 (lihat catatan di ui-mobile.yml). `timeout` hanya
          # membunuh anak langsungnya, sedangkan apt-get tetap hidup memegang
          # ujung tulis pipa; `tee` menunggu EOF yang tidak pernah datang.
          #
          # Gantinya: jalankan perintah sebagai pemimpin grup proses sendiri
          # (set -m), lalu bunuh GRUP itu saat batas lewat, sehingga apt-get dan
          # seluruh turunannya ikut mati. Tanpa tee, keluaran ditulis ke berkas;
          # kalau gagal, ekornya dicetak supaya penyebabnya tetap terbaca.
          jalankan_berbatas() {
            batas=$1
            log=$2
            shift 2
            set -m
            "$@" >"$log" 2>&1 &
            anak=$!
            set +m
            detik=0
            while kill -0 "$anak" 2>/dev/null; do
              if [ "$detik" -ge "$batas" ]; then
                echo "Batas $batas detik lewat; menghentikan grup proses $anak."
                kill -TERM -- "-$anak" 2>/dev/null || kill -TERM "$anak" 2>/dev/null
                sleep 10
                kill -KILL -- "-$anak" 2>/dev/null || kill -KILL "$anak" 2>/dev/null
                wait "$anak" 2>/dev/null
                return 124
              fi
              sleep 1
              detik=$((detik + 1))
            done
            wait "$anak"
          }

          # 420 detik sangat lapang: unduhan normal selesai dalam hitungan detik,
          # sedangkan percobaan terburuk 3 x 420 = 21 menit masih di bawah
          # timeout job 40 menit, jadi langkah tes di bawahnya tetap kebagian.
          for percobaan in 1 2 3; do
            echo "::group::apt percobaan $percobaan"
            if jalankan_berbatas 420 "/tmp/apt-$percobaan.log" \
                 /tmp/ui-browser/node_modules/.bin/playwright install-deps chromium; then
              echo "::endgroup::"
              echo "Dependensi sistem terpasang pada percobaan $percobaan."
              exit 0
            fi
            echo "::endgroup::"
            echo "Percobaan $percobaan gagal atau melewati 420 detik, ulangi."
            tail -n 40 "/tmp/apt-$percobaan.log" || true
            sleep 15
          done
          echo "::error::apt gagal tiga kali. Mirror paket kemungkinan sedang bermasalah; periksa /tmp/apt-*.log."
          exit 1
      - name: Download Chromium engine
        run: |
          # Tanpa --with-deps: dependensi sistem sudah ditangani langkah di atas,
          # dan unduhan inilah yang di-cache.
          set -o pipefail
          /tmp/ui-browser/node_modules/.bin/playwright install chromium 2>&1 | tee /tmp/browser-install.log
      - name: Test built production assets
        run: |
          npx vite preview --host 127.0.0.1 --port 3016 > /tmp/vite-production.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3016/ > /dev/null && break; sleep 1; done
          node scripts/ui-lazy-browser.mjs
          node scripts/ui-browser.mjs
          node scripts/ui-theme-browser.mjs
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const reports=JSON.parse(readFileSync('ui-evidence/report.json','utf8'));
          if(reports.length!==12||reports.some(r=>r.violations.length||r.errors.length))process.exit(1);
          JS
      - name: Measure visibility-driven chunk loading
        run: |
          npx vite preview --host 127.0.0.1 --port 3016 > /tmp/vite-chunks.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3016/ > /dev/null && break; sleep 1; done
          node scripts/ui-lazy-chunks-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-production-evidence
          path: ui-evidence/
