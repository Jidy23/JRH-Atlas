name: Production lazy loading checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      # Chunks are packed by organ system at build time, so the visibility-driven
      # loader can skip whole systems instead of only the one leftover chunk.
      - name: Repack anatomy chunks per organ system
        run: node scripts/repack-chunks.mjs
      - name: Verify chunk packing matches organ systems
        run: node scripts/validate-chunks.mjs
      - run: npm run build
      # Prerender menulis HTML per rute, sitemap, dan menyalin aset publik.
      # Diperiksa terhadap keluaran nyata: rute yang lupa punya judul sendiri
      # sebelumnya hanya terlihat di produksi.
      - name: Verify prerendered routes and public assets
        run: |
          node --input-type=module - <<'JS'
          import {existsSync, readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('app/rute.json','utf8'));
          const gagal=[];
          for(const r of data.rute){
            const f=r.path==='/'?'dist/index.html':`dist${r.path}/index.html`;
            if(!existsSync(f)){gagal.push(`${r.path}: tidak ada ${f}`);continue;}
            const html=readFileSync(f,'utf8');
            if(!html.includes(`<link rel="canonical" href="${data.situs}${r.path}" />`))gagal.push(`${r.path}: kanonik salah`);
            if(!html.includes('application/ld+json'))gagal.push(`${r.path}: JSON-LD hilang`);
            if(!html.includes('rel="manifest"'))gagal.push(`${r.path}: manifest hilang`);
          }
          for(const a of ['dist/manifest.webmanifest','dist/robots.txt','dist/sitemap.xml'])if(!existsSync(a))gagal.push(`hilang: ${a}`);
          if(gagal.length){console.error(gagal.join('\n'));process.exit(1);}
          console.log(`✓ ${data.rute.length} rute + aset publik lengkap`);
          JS
      - name: Install browser tools
        run: |
          npm install --prefix /tmp/ui-browser --no-package-lock playwright @axe-core/playwright
          /tmp/ui-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test built production assets
        run: |
          npx vite preview --host 127.0.0.1 --port 3016 > /tmp/vite-production.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3016/ > /dev/null && break; sleep 1; done
          node scripts/ui-lazy-browser.mjs
          node scripts/ui-browser.mjs
          node scripts/ui-theme-browser.mjs
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const reports=JSON.parse(readFileSync('ui-evidence/report.json','utf8'));
          if(reports.length!==12||reports.some(r=>r.violations.length||r.errors.length))process.exit(1);
          JS
      - name: Measure visibility-driven chunk loading
        run: |
          npx vite preview --host 127.0.0.1 --port 3016 > /tmp/vite-chunks.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3016/ > /dev/null && break; sleep 1; done
          node scripts/ui-lazy-chunks-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-production-evidence
          path: ui-evidence/
