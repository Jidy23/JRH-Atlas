name: Cek

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cek:
    name: Typecheck & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # `npm run check` only covers **/*.ts, **/*.tsx and **/*.mts, so a syntax
      # error in a .mjs test script reached main unnoticed: the chunk measurement
      # step died with "SyntaxError: missing ) after argument list" the first time
      # it actually ran. Parse every script before anything else.
      - name: Parse check scripts
        run: |
          for file in scripts/*.mjs; do node --check "$file"; done
      # Checks the 3D viewer against the installed three build. A camera fix
      # once used OrbitControls/TOUCH members that do not exist in the pinned
      # three version, and the only signal was a bare tsc error.
      - name: Verify 3D control API usage
        run: node scripts/verify-scene-controls.mjs
      - name: Typecheck
        run: npm run check
      # app/rute.json kini sumber tunggal untuk path, judul, deskripsi, dan
      # sitemap. Tanpa langkah ini, rute baru bisa lupa didaftarkan atau judul
      # melewati batas panjang hasil pencarian tanpa ada yang menolak.
      - name: Audit rute & metadata
        run: npm run audit:rute
      # Setiap chunk disimpan dua kali (mentah + .gz) karena penampil memilih
      # salah satunya tergantung DecompressionStream. Artinya setiap penambahan
      # chunk membebani repo dua kali, dan dulu tidak ada yang mengukurnya.
      - name: Audit anggaran aset
        run: npm run audit:aset
      - name: Audit kontras WCAG
        run: npm run audit:kontras
      # DESIGN.md aturan #1: warna komponen harus dibaca dari token, bukan
      # literal. Tanpa langkah ini aturan itu hanya prosa; polish.css sempat
      # dianggap "selesai" padahal ratusan warna literal masih tersebar.
      - name: Audit token warna
        run: npm run audit:token
      # DESIGN.md aturan #8/#9/#10: spasi, radius, huruf, elevasi, z-index dan
      # durasi dibaca dari app/skala.css; tidak ada font-family liar; skala.css
      # dimuat paling awal dan bebas warna. Tanpa langkah ini, "skala tunggal"
      # hanya niat, dan token hantu (var() tanpa definisi) tidak terdeteksi
      # karena CSS tidak melempar galat untuk itu.
      - name: Audit skala desain
        run: npm run audit:skala
      - name: Audit bank soal
        run: npm run audit:soal
      - name: Laporan dependensi
        run: npm audit || true
