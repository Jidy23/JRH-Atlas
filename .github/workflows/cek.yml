name: Cek

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cek:
    name: Typecheck & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Audit kontras WCAG
        run: npm run audit:kontras
      - name: Laporan dependensi
        run: npm audit || true
