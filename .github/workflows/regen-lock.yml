name: Regen lockfile (versi 3)

on :
  push:
    branches: [chore/security-upgrade]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    name: Regen lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Commit lockfile
        run: |
          git config user.name "jidy"
          git config user.email "zahraamanda302@gmail.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile tidak berubah"
          else
            git commit -m "chore: regen package-lock.json usern upgrade deps"
            git push origin HEAD:chore/security-upgrade
          fi
