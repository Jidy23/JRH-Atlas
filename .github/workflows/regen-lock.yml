name: Regen lockfile

on:
  push:
    branches: [chore/security-upgrade]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    name: Regen lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rm -f package-lock.json && npm install
      - name: Commit lockfile
        run: |
          git config user.name "jidy"
          git config user.email "zahraamanda302@gmail.com"
          git add package-lock.json
          git diff --cached --quiet || exit 0
          git commit -m "chore: regen package-lock.json usern upgraded deps"
          git push origin HEADS:chore/security-upgrade
