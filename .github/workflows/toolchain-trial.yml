name: Toolchain removal trial
on:
  push:
    branches: [chore/remove-unused-toolchains]
    paths: [.github/workflows/toolchain-trial.yml]
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Remove unused toolchains and regenerate lockfile
        run: |
          npm pkg delete dependencies.vinext dependencies.shadcn
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Typecheck
        run: npm run check
      - name: Contrast audit
        run: npm run audit:kontras
      - name: Atlas validation
        run: node scripts/validate-atlas.mjs
      - name: Interaction contracts (not browser E2E)
        run: node --experimental-strip-types scripts/validate-interactions.mjs
      - name: Production build
        run: npm run build
      - name: Audit and dependency evidence
        if: always()
        run: |
          mkdir -p evidence
          npm explain braces > evidence/braces-chain.txt 2>&1 || true
          set +e
          npm audit --json > evidence/audit.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("evidence/audit.json"));if(a.error||!a.metadata)process.exit(1);console.log(JSON.stringify(a.metadata.vulnerabilities,null,2));'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-trial-evidence
          path: evidence/
      - name: Commit only after all checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove unused vinext and shadcn CLI dependency chains'
            git push origin HEAD:chore/remove-unused-toolchains
          fi
