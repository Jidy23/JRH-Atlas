name: Mobile and cross-browser regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    # Dinaikkan dari 20 ke 40 menit. Mobile #100 dan #101 sama-sama mati tepat
    # di menit ke-20 pada langkah "Install browser engines", sementara run #96
    # di main menyelesaikan langkah yang sama dalam 5 menit 03 detik. Yang
    # kehabisan waktu adalah unduhan Chromium+WebKit+Firefox, bukan tesnya:
    # langkah 10 selalu ter-skip, jadi tidak ada asersi yang sempat gagal.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      # Anatomy chunks are packed per organ system at build time. Without this
      # step the mobile job downloaded all 14 source chunks (~31 MB) instead of
      # the 7 the production job downloads, so it tested different binaries
      # and hit the 45 s timeout on an emulated Pixel 7.
      - name: Repack anatomy chunks per organ system
        run: node scripts/repack-chunks.mjs
      - name: Verify chunk packing matches organ systems
        run: node scripts/validate-chunks.mjs
      - run: npm run build
      - name: Install browser engines
        env:
          # Batas per koneksi unduhan Playwright (milidetik). Tanpa ini,
          # koneksi yang menggantung dibiarkan sampai timeout job.
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '180000'
        run: |
          npm install --prefix /tmp/ui-browser --no-package-lock playwright @axe-core/playwright
          # tee, bukan redirect murni. Dengan "> berkas", seluruh keluaran
          # disembunyikan; kalau langkah ini kena timeout job, berkasnya ikut
          # hilang dan kita tidak pernah tahu engine mana yang macet.
          set -o pipefail
          /tmp/ui-browser/node_modules/.bin/playwright install --with-deps chromium webkit firefox 2>&1 | tee /tmp/browser-install.log
      - name: Test touch and narrow-screen navigation on built assets
        run: |
          npx vite preview --host 127.0.0.1 --port 3016 > /tmp/vite-mobile.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3016/ > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:3016/ > /dev/null
          node scripts/ui-mobile-browser.mjs
      - name: Publish diagnostic report
        if: always()
        run: |
          if test -f ui-evidence/mobile-report.json; then cat ui-evidence/mobile-report.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-mobile-evidence
          path: ui-evidence/
