name: Mobile and cross-browser regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    # Dinaikkan dari 20 ke 40 menit di Batch 5. Mobile #100 dan #101 mati tepat
    # di menit ke-20 pada langkah "Install browser engines".
    #
    # Mobile #104 lalu menghabiskan seluruh 40 menit di langkah yang sama tanpa
    # satu pun asersi berjalan. Penyebabnya bukan unduhan Chromium, melainkan
    # apt: `playwright install --with-deps` menarik 119 MB arsip sistem, dan
    # mirror azure.archive.ubuntu.com berhenti menjawab untuk beberapa paket
    # (fonts-ipafont-gothic 2m08s, fonts-freefont-ttf 2m39s, libflite1 2m06s)
    # sampai job dibunuh. Run #105 mengunduh 119 MB yang sama dalam 9 detik,
    # jadi ini gangguan mirror, bukan cacat workflow.
    #
    # Karena itu apt dan unduhan browser sekarang dipisah:
    #   - apt diberi batas waktu per percobaan lalu dicoba ulang, sehingga
    #     mirror yang menggantung gagal cepat alih-alih memakan seluruh jatah
    #     job;
    #   - engine di-cache, karena unduhannya deterministik per versi Playwright.
    #
    # Batch 8: pola `timeout 420 cmd | tee log` TERBUKTI tidak membatasi apa pun
    # di Mobile #109 (melewati 26 menit). Diganti fungsi jalankan_berbatas yang
    # membunuh seluruh grup proses.
    #
    # Batch 9: batas 420 detik itu TERBUKTI BEKERJA di Mobile #110 -- berhenti
    # pada 420,8 detik, bukan menggantung. Tetapi job tetap gagal: apt-get yang
    # dipanggil lewat `sudo` berjalan di sesi pty sendiri (sudo use_pty, bawaan
    # Ubuntu 24.04), jadi lolos dari kill grup. Percobaan 2 dan 3 lalu mati
    # seketika pada kunci dpkg yang masih dipegang proses yatim itu.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      # Anatomy chunks are packed per organ system at build time. Without this
      # step the mobile job downloaded all 14 source chunks (~31 MB) instead of
      # the 7 the production job downloads, so it tested different binaries
      # and hit the 45 s timeout on an emulated Pixel 7.
      - name: Repack anatomy chunks per organ system
        run: node scripts/repack-chunks.mjs
      - name: Verify chunk packing matches organ systems
        run: node scripts/validate-chunks.mjs
      - run: npm run build
      - name: Install Playwright package
        id: pw
        run: |
          npm install --prefix /tmp/ui-browser --no-package-lock playwright @axe-core/playwright
          # Versi dibaca dari paket yang benar-benar terpasang, bukan ditebak,
          # supaya kunci cache ikut berubah saat Playwright naik versi.
          versi=$(node -p "require('/tmp/ui-browser/node_modules/playwright/package.json').version")
          echo "versi=$versi" >> "$GITHUB_OUTPUT"
          echo "Playwright $versi terpasang."
      - name: Cache browser engines
        id: cache-engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.versi }}
      # Batch 9: akar masalahnya adalah mirror yang berhenti menjawab, bukan
      # kurangnya batas waktu. apt punya opsi timeout jaringan yang jauh lebih
      # murah daripada membunuh proses: kalau satu paket tidak menjawab dalam
      # 30 detik, apt menyerah lalu mencoba lagi, alih-alih menggantung sampai
      # batas 420 detik habis. DPkg::Lock::Timeout membuat percobaan ulang
      # menunggu kunci dpkg sebentar, bukan langsung mati seperti di #110.
      - name: Batasi waktu jaringan apt
        run: |
          echo 'Acquire::http::Timeout "30";'  | sudo tee    /etc/apt/apt.conf.d/99jrh-timeouts >/dev/null
          echo 'Acquire::https::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/99jrh-timeouts >/dev/null
          echo 'Acquire::ftp::Timeout "30";'   | sudo tee -a /etc/apt/apt.conf.d/99jrh-timeouts >/dev/null
          echo 'Acquire::Retries "2";'         | sudo tee -a /etc/apt/apt.conf.d/99jrh-timeouts >/dev/null
          echo 'DPkg::Lock::Timeout "120";'    | sudo tee -a /etc/apt/apt.conf.d/99jrh-timeouts >/dev/null
          sudo cat /etc/apt/apt.conf.d/99jrh-timeouts
      - name: Install system dependencies for browser engines
        run: |
          # Batch 9: membunuh grup proses saja TIDAK cukup. playwright memanggil
          # `sudo apt-get`, dan sudo memakai use_pty secara bawaan, sehingga
          # apt-get berjalan di sesi terminal sendiri di luar grup yang kita
          # bunuh. Bukti Mobile #110: batas berhenti tepat waktu (420,8 detik),
          # tetapi apt-get PID 2881 tetap hidup memegang
          # /var/lib/dpkg/lock-frontend, jadi percobaan 2 dan 3 mati seketika
          # dengan exit 100 tanpa mengunduh satu paket pun.
          #
          # Karena itu proses yatim dibersihkan menurut NAMA proses, bukan
          # menurut grup, sebelum tiap percobaan.
          bersihkan_apt() {
            sisa=$( { pgrep -a -x apt-get || true; pgrep -a -x dpkg || true; pgrep -a -x apt-helper || true; } )
            if [ -n "$sisa" ]; then
              echo "Proses apt yatim dari percobaan sebelumnya:"
              echo "$sisa"
              sudo pkill -KILL -x apt-get 2>/dev/null || true
              sudo pkill -KILL -x dpkg 2>/dev/null || true
              sudo pkill -KILL -x apt-helper 2>/dev/null || true
              sleep 2
            fi
          }
          jalankan_berbatas() {
            batas=$1
            log=$2
            shift 2
            set -m
            "$@" >"$log" 2>&1 &
            anak=$!
            set +m
            detik=0
            while kill -0 "$anak" 2>/dev/null; do
              if [ "$detik" -ge "$batas" ]; then
                echo "Batas $batas detik lewat; menghentikan grup proses $anak."
                kill -TERM -- "-$anak" 2>/dev/null || kill -TERM "$anak" 2>/dev/null
                sleep 10
                kill -KILL -- "-$anak" 2>/dev/null || kill -KILL "$anak" 2>/dev/null
                wait "$anak" 2>/dev/null
                return 124
              fi
              sleep 1
              detik=$((detik + 1))
            done
            wait "$anak"
          }

          # Dengan timeout jaringan 30 detik, batas 420 detik jarang tersentuh:
          # mirror yang menggantung menggagalkan apt jauh lebih cepat daripada
          # batas itu. Batas 420 tetap dipertahankan sebagai jaring pengaman
          # untuk kasus yang tidak tertangani opsi jaringan apt.
          for percobaan in 1 2 3; do
            echo "::group::apt percobaan $percobaan"
            bersihkan_apt
            if jalankan_berbatas 420 "/tmp/apt-$percobaan.log" \
                 /tmp/ui-browser/node_modules/.bin/playwright install-deps chromium webkit firefox; then
              echo "::endgroup::"
              echo "Dependensi sistem terpasang pada percobaan $percobaan."
              exit 0
            fi
            echo "::endgroup::"
            echo "Percobaan $percobaan gagal atau melewati 420 detik, ulangi."
            tail -n 40 "/tmp/apt-$percobaan.log" || true
            sleep 15
          done
          echo "::error::apt gagal tiga kali. Mirror paket kemungkinan sedang bermasalah; periksa /tmp/apt-*.log."
          exit 1
      - name: Download browser engines
        run: |
          # Tanpa --with-deps: dependensi sistem sudah ditangani langkah di
          # atas, dan unduhan inilah yang di-cache.
          set -o pipefail
          /tmp/ui-browser/node_modules/.bin/playwright install chromium webkit firefox 2>&1 | tee /tmp/browser-install.log
      - name: Test touch and narrow-screen navigation on built assets
        run: |
          npx vite preview --host 127.0.0.1 --port 3016 > /tmp/vite-mobile.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3016/ > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:3016/ > /dev/null
          node scripts/ui-mobile-browser.mjs
      - name: Publish diagnostic report
        if: always()
        run: |
          if test -f ui-evidence/mobile-report.json; then cat ui-evidence/mobile-report.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-mobile-evidence
          path: ui-evidence/
