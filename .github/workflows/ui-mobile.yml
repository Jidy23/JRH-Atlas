name: Mobile and cross-browser regression
on:
  push:
    branches: [feat/ui-ux-rebuild]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install browser engines
        run: |
          npm install --prefix /tmp/ui-browser --no-package-lock playwright @axe-core/playwright
          /tmp/ui-browser/node_modules/.bin/playwright install --with-deps chromium webkit firefox
      - name: Test touch and narrow-screen navigation on built assets
        run: |
          npx vite preview --host 127.0.0.1 --port 3016 > /tmp/vite-mobile.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3016/ > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:3016/ > /dev/null
          node scripts/ui-mobile-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-mobile-evidence
          path: ui-evidence/
