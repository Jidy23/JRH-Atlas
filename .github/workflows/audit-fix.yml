name: Audit fix semua

on :
  push:
    branches: [chore/audit-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Fix semua vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit fix + overrides
        run: |
          npm install
          npm audit fix || true
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.overrides=Object.assign({},p.overrides,{braces:'^3.0.3',fflate:'^0.8.2',tinypool:'^2.2.0'});bs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          npm install
          npm audit || true
      - name: Commit hasil
        run: |
          git config user.name "jidy"
          git config user.email "zahraamanda302@gmail.com"
          git add package.plason package-lock.json
          if git diff --cached --quiet; then
            echo "Tidak change"
          else
            git commit -m "chore: audit fix semua vuln (audit fix + overrides)"
            git push origin HEAD:chore/audit-fix
          fi
