name: Audit fix v3

on :
  push:
    branches: [chore/audit-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Fix vuln v3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit fix + overrides
        run: |
          npm install
          npm audit fix || true
          npm pkg set "overrides.fflate=^0.8.2"
          npm pkg set "overrides.tinypool=^2.2.0"
          npm pkg set "devDependencies.oxfmt=^0.73.0"
          npm install
          echo "----- AUDIT -----"
          npm audit || true
          echo "----- VERSI -----"
          node -p "['fflate','tinypool','oxfmt'].map(n=>n,'=',((require('./package-lock.json').packages['node_modules/'+n])||{}).version)).join(' ')"
      - name: Commit hasil
        run: |
          git config user.name "jidy"
          git config user.email "zahraamanda302@gmail.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Tidak change"
          else
            git commit -m "chore: audit fix + overrides (fflate, tinypool, oxfmt)"
            git push origin HEAD:chore/audit-fix
          fi
